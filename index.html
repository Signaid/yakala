const TAUNTS = [
  'YAKALA BENI!','HAHAHAHA!','YAPAMAZZSIN!',
  'KAÇTIM YİNE!','YAVAŞSINN!','BU KADAR MI?',
  'REZALET!','HOP KALAKALIN!','YİNE OLMADIIII!',
  'AĞLAMA BEBEK!','GİT EVE!','💀 MAHVOLDUN!',
  'EYVAH EYVAH!','SKTIR LAN!','HAHAHAhaha!',
];

function initBird(){bird={x:90*SC,y:H/2,vy:0,r:28*SC,angle:0,flap:0,squish:1};}
function initPipes(){pipes=[];}
function initAll(){initBird();initPipes();particles=[];taunts=[];frame=0;score=0;pipeTimer=0;document.getElementById('scoreTxt').textContent='🎯 0';}

function addPipe(){
  const gap=240*SC,minY=80*SC,maxY=H-120*SC-gap;
  const topH=minY+Math.random()*(maxY-minY);
  pipes.push({x:W+20,topH,gap,passed:false,speed:(1.8+score*0.03)*SC});
}

function flap(){
  if(state==='idle'){state='playing';initAll();addPipe();}
  else if(state==='dead'){state='playing';initAll();addPipe();return;}
  bird.vy=-8*SC; bird.squish=1.4;
  spawnParticle(bird.x-bird.r,bird.y,'#fff');
}

canvas.addEventListener('click',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap();});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')flap();});

function spawnParticle(x,y,col){
  for(let i=0;i<8;i++) particles.push({x,y,vx:(Math.random()-.5)*6*SC,vy:(Math.random()-.5)*6*SC-2*SC,life:1,col,r:(Math.random()*5+2)*SC});
}
function spawnTaunt(msg){
  taunts.push({x:bird.x+50*SC+Math.random()*80*SC,y:bird.y-20*SC-Math.random()*40*SC,msg,life:1,vy:-1.2*SC});
}

function drawBg(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d1b2a');grad.addColorStop(0.6,'#1b3a6a');grad.addColorStop(1,'#2d6a3a');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<30;i++){ctx.beginPath();ctx.arc(((i*173)%W),((i*91)%(H*0.36)),1,0,Math.PI*2);ctx.fill();}
}
function drawGround(){
  ctx.fillStyle='#5c3317';ctx.fillRect(0,H-40*SC,W,40*SC);
  ctx.fillStyle='#3a7d1a';ctx.fillRect(0,H-42*SC,W,10*SC);
  for(let i=0;i<W;i+=30*SC){
    ctx.beginPath();ctx.arc(i+(frame*1.5)%(30*SC)-(15*SC),H-42*SC,8*SC,Math.PI,0);
    ctx.fillStyle='#4a9e22';ctx.fill();
  }
}
function drawPipes(){
  const pw=60*SC;
  pipes.forEach(p=>{
    const boty=p.topH+p.gap;
    ctx.fillStyle='#1a5c1a';ctx.fillRect(p.x+4*SC,p.topH+20*SC,pw,H-p.topH-p.gap-40*SC);
    ctx.fillStyle='#2d8a2d';ctx.fillRect(p.x,p.topH+20*SC,pw-4*SC,H-p.topH-p.gap-40*SC);
    ctx.fillStyle='#1a5c1a';ctx.fillRect(p.x-6*SC,boty,pw+12*SC,24*SC);
    ctx.fillStyle='#2d8a2d';ctx.fillRect(p.x-6*SC,boty,pw+8*SC,20*SC);
    ctx.fillStyle='#1a5c1a';ctx.fillRect(p.x+4*SC,0,pw,p.topH);
    ctx.fillStyle='#2d8a2d';ctx.fillRect(p.x,0,pw-4*SC,p.topH);
    ctx.fillStyle='#1a5c1a';ctx.fillRect(p.x-6*SC,p.topH-24*SC,pw+12*SC,24*SC);
    ctx.fillStyle='#2d8a2d';ctx.fillRect(p.x-6*SC,p.topH-20*SC,pw+8*SC,20*SC);
  });
}
function drawBird(){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.min(Math.max(bird.angle,-.5),1.2));
  const sq=bird.squish;ctx.scale(1/sq,sq);
  ctx.save();ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.clip();
  ctx.drawImage(friendImg,-bird.r,-bird.r,bird.r*2,bird.r*2);ctx.restore();
  ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);
  ctx.strokeStyle='#ff6a00';ctx.lineWidth=4*SC;ctx.stroke();

  // "YAKALA!" label
  ctx.font = (13*SC)+'px "Bangers",cursive';
  ctx.textAlign='center';
  ctx.strokeStyle='#000';ctx.lineWidth=3*SC;
  ctx.strokeText('YAKALA!',0,bird.r+15*SC);
  ctx.fillStyle='#ff0';
  ctx.fillText('YAKALA!',0,bird.r+15*SC);
  ctx.restore();
}
function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
}
function drawTaunts(){
  taunts.forEach(t=>{
    ctx.globalAlpha=t.life;
    ctx.font='bold '+(16*SC)+'px "Bangers",cursive';
    ctx.textAlign='left';
    ctx.strokeStyle='#000';ctx.lineWidth=4*SC;ctx.strokeText(t.msg,t.x,t.y);
    ctx.fillStyle='#ffd700';ctx.fillText(t.msg,t.x,t.y);
  });
  ctx.globalAlpha=1;
}
function drawIdle(){
  drawBg();drawGround();
  ctx.textAlign='center';
  ctx.font=(52*SC)+'px "Bangers",cursive';
  ctx.strokeStyle='#000';ctx.lineWidth=6*SC;ctx.strokeText('YAKALA BENİ!',W/2,H/2-60*SC);
  ctx.fillStyle='#ff6a00';ctx.fillText('YAKALA BENİ!',W/2,H/2-60*SC);
  ctx.font=(22*SC)+'px "Fredoka One",cursive';
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3*SC;
  ctx.strokeText('Tıkla / Boşluk = Uç',W/2,H/2);
  ctx.fillText('Tıkla / Boşluk = Uç',W/2,H/2);
  bird.x=W/2;bird.y=H/2+90*SC+Math.sin(frame*.07)*12*SC;
  drawBird();
}
function drawDead(){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font=(52*SC)+'px "Bangers",cursive';
  ctx.strokeStyle='#f00';ctx.lineWidth=6*SC;ctx.strokeText('YINE YAPAMADIN!',W/2,H/2-60*SC);
  ctx.fillStyle='#ffd700';ctx.fillText('YINE YAPAMADIN!',W/2,H/2-60*SC);
  ctx.font=(28*SC)+'px "Fredoka One",cursive';ctx.fillStyle='#fff';
  ctx.fillText('Skor: '+score,W/2,H/2);
  ctx.font=(20*SC)+'px "Fredoka One",cursive';ctx.fillStyle='#aaa';
  ctx.fillText(TAUNTS[score%TAUNTS.length],W/2,H/2+40*SC);
  ctx.fillText('Tıkla ve tekrar dene 😈',W/2,H/2+80*SC);
}

function collides(){
  const r=bird.r-4*SC,pw=60*SC;
  if(bird.y+r>H-42*SC||bird.y-r<0) return true;
  for(const p of pipes){
    if(bird.x+r>p.x-6*SC&&bird.x-r<p.x+pw+6*SC){
      if(bird.y-r<p.topH||bird.y+r>p.topH+p.gap) return true;
    }
  }
  return false;
}

function update(){
  frame++;
  if(state!=='playing') return;
  bird.vy+=0.3*SC; bird.y+=bird.vy;
  bird.angle=bird.vy*0.06; bird.squish+=(1-bird.squish)*0.15;
  pipeTimer++;
  const interval=Math.max(70,120-score*2);
  if(pipeTimer>interval){addPipe();pipeTimer=0;}
  pipes.forEach(p=>{p.x-=p.speed;});
  pipes=pipes.filter(p=>p.x>-80);
  pipes.forEach(p=>{
    if(!p.passed&&p.x+60*SC<bird.x){
      p.passed=true;score++;
      const el=document.getElementById('scoreTxt');el.textContent='🎯 '+score;
      if(score>hi){hi=score;document.getElementById('hiTxt').textContent='EN İYİ: '+hi;}
      spawnParticle(bird.x,bird.y,'#ffd700');
      if(score%3===0) spawnTaunt(TAUNTS[Math.floor(Math.random()*TAUNTS.length)]);
    }
  });
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2*SC;p.life-=.04;});
  particles=particles.filter(p=>p.life>0);
  taunts.forEach(t=>{t.y+=t.vy;t.life-=.015;});
  taunts=taunts.filter(t=>t.life>0);
  if(collides()){
    state='dead';
    spawnParticle(bird.x,bird.y,'#ff4400');
    spawnParticle(bird.x,bird.y,'#ffaa00');
    spawnTaunt('ÇARPTINN! 💀');
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='idle'){drawIdle();return;}
  drawBg();drawPipes();drawGround();drawParticles();drawBird();drawTaunts();
  if(state==='dead') drawDead();
}

function loop(){update();draw();requestAnimationFrame(loop);}
initAll();loop();
</script>
